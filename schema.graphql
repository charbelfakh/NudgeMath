type AdminModelsType {
  visionModel: String!
  generationModel: String!
  solverModel: String!
  visionPresets: [ModelPresetType!]!
  generationPresets: [ModelPresetType!]!
  solverPresets: [ModelPresetType!]!
}

type AuthPayloadType {
  token: String
  username: String
  expiresAt: Int
  error: String
}

type CheckResultType {
  name: String!
  passed: Boolean!
  detail: String!
}

type ClaudeLoginResultType {
  signedIn: Boolean!
  detail: String!
  error: String
}

type ClaudeLoginStartType {
  signedIn: Boolean!
  url: String
}

type ClaudeSubscriptionStatusType {
  signedIn: Boolean!
  detail: String!
  model: String!
  effort: String
}

input ConversationTurnInput {
  role: String!
  text: String!
}

type CurriculumTopicType {
  gradeBand: String!
  gradeRange: String!
  topic: String!
  template: Boolean!
  difficulties: [String!]!
  description: String!
}

type DeterministicResultType {
  passed: Boolean!
  checks: [CheckResultType!]!
}

type EvalCaseType {
  caseId: String
  problem: String!
  studentAnswer: String!
  correctAnswer: String!
  expectations: JSON!
}

type EvalReportType {
  passed: Boolean!
  caseId: String
  problem: String!
  hintText: String!
  revealsAnswer: Boolean!
  meta: HintMetaType!
  flagDisagreement: Boolean!
  modelAnswerDisagreement: Boolean
  deterministic: DeterministicResultType!
  judge: JudgeResultType
  summary: String!
}

type GeneratedProblemType {
  problem: String!
  problemId: String!
  gradeLevel: String!
  topic: String!
  difficulty: String!
  source: String!
  verified: Boolean!
  meta: HintMetaType!
}

type HintMetaType {
  name: String
  model: String
  provider: String
  latencyMs: Int
  error: String
}

input HintRequestInput {
  problem: String!
  studentAnswer: String!
  gradeLevel: String = null
  subject: String = null
  correctAnswer: String = null
  problemId: String = null
  history: [ConversationTurnInput!] = null
}

type HintType {
  hintText: String!
  revealsAnswer: Boolean!
  answerCorrect: Boolean!
  meta: HintMetaType!
}

"""
The `JSON` scalar type represents JSON values as specified by [ECMA-404](https://ecma-international.org/wp-content/uploads/ECMA-404_2nd_edition_december_2017.pdf).
"""
scalar JSON @specifiedBy(url: "https://ecma-international.org/wp-content/uploads/ECMA-404_2nd_edition_december_2017.pdf")

type JudgeMetaType {
  name: String
  model: String
  provider: String
  latencyMs: Int
  error: String
}

type JudgeResultType {
  passed: Boolean!
  score: Float!
  checks: [CheckResultType!]!
  meta: JudgeMetaType!
}

type ModelPresetType {
  name: String!
  provider: String!
  model: String!
}

type Mutation {
  generateHint(request: HintRequestInput!): HintType!
  transcribeProblem(image: String!): TranscriptionType!
  generateProblem(gradeLevel: String!, topic: String = null, difficulty: String! = "medium", mode: String! = "auto"): GeneratedProblemType!
  login(username: String!, password: String!): AuthPayloadType!
  evaluateCase(caseId: String!, withJudge: Boolean! = false): EvalReportType
  setModel(kind: String!, preset: String!): AdminModelsType
  setClaudeEffort(effort: String = null): ClaudeSubscriptionStatusType
  startClaudeLogin: ClaudeLoginStartType
  finishClaudeLogin(code: String!): ClaudeLoginResultType
  disconnectClaudeSubscription: ClaudeSubscriptionStatusType
  solveProblem(problem: String!, gradeLevel: String = null): SolutionType
}

type Query {
  hints: [EvalCaseType!]!
  curriculum(gradeLevel: String = null): [CurriculumTopicType!]!
  revealAnswer(problemId: String!): RevealedAnswerType
  adminModels: AdminModelsType
  claudeSubscription: ClaudeSubscriptionStatusType
}

type RevealedAnswerType {
  problemId: String!
  correctAnswer: String
  found: Boolean!
}

type SolutionType {
  solutionText: String!
  finalAnswer: String!
  meta: HintMetaType!
}

type TranscriptionType {
  problem: String!
  studentAnswer: String!
  meta: HintMetaType!
}
